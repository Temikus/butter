name: Security

on:
  push:
    branches: [main]
  schedule:
    # Weekly scan to catch new CVEs in dependencies / stdlib
    - cron: "0 8 * * 1"

# Least privilege: read the repo, write findings to the Security tab.
permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    name: Go Security (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to a full commit SHA (supply-chain hardening).
      - name: Run gosec
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif

  betterleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Installed by version-pinned release tarball rather than a marketplace
      # action — avoids depending on a scanner action's mutable tags.
      - name: Install betterleaks
        run: |
          # renovate: datasource=github-releases depName=betterleaks/betterleaks
          VERSION="v1.9.0"
          curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/${VERSION}/betterleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin betterleaks
      - name: Run betterleaks
        run: betterleaks git . --exit-code 1

  grype:
    name: Vulnerability Scan (Grype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to a full commit SHA (supply-chain hardening).
      - name: Grype filesystem scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          path: "."
          severity-cutoff: "high"
          only-fixed: "true"
          output-format: "sarif"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
