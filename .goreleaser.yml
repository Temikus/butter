version: 2

project_name: butter

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./... -race -count=1

builds:
  - id: butter
    main: ./cmd/butter/
    binary: butter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/temikus/butter/internal/version.Version={{.Version}}
      - -X github.com/temikus/butter/internal/version.Commit={{.Commit}}
      - -X github.com/temikus/butter/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# SBOM generation. Requires syft on PATH; release.yml installs it via
# anchore/sbom-action/download-syft.
sboms:
  - artifacts: archive

# Keyless cosign OIDC signing — no stored keys.
# Requires id-token:write in release.yml and cosign-installer to run first.
# Signs the checksums file; every archive hash is listed there.
# cosign v3 bundle format (signature + certificate in a single .bundle file).
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: temikus
    name: butter
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
